[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gazeearth"
version = "0.0.0"
description = "Training-free source-resolved topology focus for remote-sensing MLLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "GazeEarth contributors"}]
dependencies = [
  "accelerate>=0.26",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=11.0",
  "pyyaml>=6.0",
  "qwen-vl-utils==0.0.14",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.1",
  "tokenizers==0.22.1",
  "huggingface-hub==0.36.0",
  "nltk>=3.9,<4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gazeearth*", "benchmarks*", "evaluation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
