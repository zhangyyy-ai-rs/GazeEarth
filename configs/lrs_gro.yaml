method: gazeearth
seed: 0
output_dir: outputs/lrs_gro_gazeearth
model:
  backend: qwen
  path: Qwen/Qwen3-VL-8B-Instruct
  attn_implementation: sdpa
  max_new_tokens: 1024
  temperature: 0.0
selector: {grid_rows: 4, grid_cols: 4, overview_long_side: 1536, max_regions: 2, max_new_tokens: 64}
